<script>
(function(){
  const D = window.G12, enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  const $ = id => document.getElementById(id);

  async function lookup(lrn){
    const base = await crypto.subtle.importKey("raw", enc.encode(lrn), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      {name:"PBKDF2", hash:"SHA-256", salt:b64(D.salt), iterations:D.iter}, base, 512));
    const rec = D.records[hex(bits.slice(0,16))];
    if(!rec) return null;
    const [iv, ct] = rec.split(".");
    const key = await crypto.subtle.importKey("raw", bits.slice(32), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(iv)}, key, b64(ct));
    return JSON.parse(dec.decode(plain));
  }

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    const lrn = $("lrn").value.replace(/\s+/g, "");
    $("err").textContent = ""; $("result").style.display = "none";
    if(!/^\d{10,14}$/.test(lrn)){ $("err").textContent = "Please enter a valid LRN (numbers only)."; return; }
    if(!window.crypto || !crypto.subtle){ $("err").textContent = "Please open this page over HTTPS."; return; }
    $("go").disabled = true; $("go").textContent = "Checking…";
    try{
      const r = await lookup(lrn);
      if(!r){ $("err").textContent = "LRN not found. Check the number and try again."; }
      else{
        $("r-lrn").textContent = r.lrn;
        $("r-name").textContent = r.name;
        $("r-score").textContent = r.score + " / " + r.total;
        $("result").style.display = "block";
      }
    }catch(_){ $("err").textContent = "Something went wrong. Please try again."; }
    $("go").disabled = false; $("go").textContent = "View my score";
  });
})();
</script>
