<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 12 Score Checker</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6a746d;
    --accent:#2f5d46; --accent-ink:#fff; --line:#ddd6c6; --ok:#2f5d46; --err:#a33a2b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141a17; --card:#1c2420; --ink:#eef1ec; --muted:#97a39b;
      --accent:#7fbf9b; --accent-ink:#0f1a14; --line:#2d3832; --ok:#7fbf9b; --err:#e58a7a; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;padding:16px}
  main{width:100%;max-width:440px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 22px}
  h1{font-size:1.55rem;margin:0 0 4px;letter-spacing:.2px}
  p.sub{margin:0 0 22px;color:var(--muted);font-family:system-ui,sans-serif;font-size:.92rem}
  label{display:block;font-family:system-ui,sans-serif;font-size:.85rem;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:13px 14px;font-size:1.1rem;font-family:ui-monospace,Menlo,monospace;
    border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);letter-spacing:1px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  button{width:100%;margin-top:14px;padding:13px;font-size:1rem;font-weight:600;font-family:system-ui,sans-serif;
    border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #err{margin-top:14px;color:var(--err);font-family:system-ui,sans-serif;font-size:.9rem;min-height:1.2em}
  #result{display:none;margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}
  #result dt{font-family:system-ui,sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:14px}
  #result dd{margin:2px 0 0;font-size:1.15rem}
  #result dd.mono{font-family:ui-monospace,Menlo,monospace}
  .score{font-size:2.4rem!important;font-weight:700;color:var(--ok)}
  footer{margin-top:14px;text-align:center;color:var(--muted);font-family:system-ui,sans-serif;font-size:.78rem}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Grade 12 Score Checker</h1>
    <p class="sub">Enter your 12-digit LRN to view your score.</p>
    <form id="f" autocomplete="off">
      <label for="lrn">LRN</label>
      <input id="lrn" inputmode="numeric" pattern="[0-9]*" maxlength="14" placeholder="e.g. 136875140454" required>
      <button id="go" type="submit">View my score</button>
    </form>
    <div id="err" role="alert"></div>
    <dl id="result">
      <dt>LRN</dt><dd class="mono" id="r-lrn"></dd>
      <dt>Name</dt><dd id="r-name"></dd>
      <dt>Score</dt><dd class="score" id="r-score"></dd>
    </dl>
  </div>
  <footer>Records are encrypted. Only your own LRN can open your record.</footer>
</main>

(function(){
  const D = window.G12, enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  const $ = id => document.getElementById(id);

  async function lookup(lrn){
    const base = await crypto.subtle.importKey("raw", enc.encode(lrn), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      {name:"PBKDF2", hash:"SHA-256", salt:b64(D.salt), iterations:D.iter}, base, 512));
    const rec = D.records[hex(bits.slice(0,16))];
    if(!rec) return null;
    const [iv, ct] = rec.split(".");
    const key = await crypto.subtle.importKey("raw", bits.slice(32), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(iv)}, key, b64(ct));
    return JSON.parse(dec.decode(plain));
  }

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    const lrn = $("lrn").value.replace(/\s+/g, "");
    $("err").textContent = ""; $("result").style.display = "none";
    if(!/^\d{10,14}$/.test(lrn)){ $("err").textContent = "Please enter a valid LRN (numbers only)."; return; }
    if(!window.crypto || !crypto.subtle){ $("err").textContent = "Please open this page over HTTPS."; return; }
    $("go").disabled = true; $("go").textContent = "Checking…";
    try{
      const r = await lookup(lrn);
      if(!r){ $("err").textContent = "LRN not found. Check the number and try again."; }
      else{
        $("r-lrn").textContent = r.lrn;
        $("r-name").textContent = r.name;
        $("r-score").textContent = r.score + " / " + r.total;
        $("result").style.display = "block";
      }
    }catch(_){ $("err").textContent = "Something went wrong. Please try again."; }
    $("go").disabled = false; $("go").textContent = "View my score";
  });
})();
</script>
</body>
</html>
